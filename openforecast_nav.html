<style>
.of-booknav {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 1000;
  display: flex;
  align-items: center;
  gap: 18px;
  flex-wrap: wrap;
  padding: 8px 18px;
  background: #ffffff;
  border-bottom: 2px solid #AE1921;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 14px;
  box-sizing: border-box;
}

.of-booknav__logo img { height: 28px; width: auto; display: block; }
.of-booknav a { color: #222222; text-decoration: none; }
.of-booknav__links { display: flex; gap: 16px; flex-wrap: wrap; }
.of-booknav__links a:hover { color: #AE1921; text-decoration: underline; }

/* Fold toggle */
.of-booknav__toggle {
  margin-left: auto;
  border: 1px solid #d5d5d5;
  background: #ffffff;
  color: #AE1921;
  border-radius: 4px;
  cursor: pointer;
  font-size: 13px;
  line-height: 1;
  padding: 5px 9px;
}
.of-booknav__toggle:hover { background: #faf6f6; }

/* Folded state: bar collapses to a small tab */
body.of-nav-folded .of-booknav {
  left: auto;
  right: 0;
  padding: 4px 8px;
  border-bottom: none;
  border-left: 2px solid #AE1921;
  border-bottom: 2px solid #AE1921;
  border-radius: 0 0 0 4px;
}
body.of-nav-folded .of-booknav__logo,
body.of-nav-folded .of-booknav__links { display: none; }

/* Push the book's own chrome down so the bar does not overlap it */
body { padding-top: 46px !important; }
.book .book-summary,
.book .book-body,
.book .book-header,
.book .book-body .body-inner { top: 46px !important; }

/* Folded: give the space back */
body.of-nav-folded { padding-top: 0 !important; }
body.of-nav-folded .book .book-summary,
body.of-nav-folded .book .book-body,
body.of-nav-folded .book .book-header,
body.of-nav-folded .book .book-body .body-inner { top: 0 !important; }

@media (max-width: 767px) {
  .of-booknav { font-size: 13px; gap: 12px; padding: 6px 12px; }
  .of-booknav__links { gap: 12px; }

  body { padding-top: 76px !important; }
  .book .book-summary,
  .book .book-body,
  .book .book-header,
  .book .book-body .body-inner { top: 76px !important; }

  body.of-nav-folded { padding-top: 0 !important; }
  body.of-nav-folded .book .book-summary,
  body.of-nav-folded .book .book-body,
  body.of-nav-folded .book .book-header,
  body.of-nav-folded .book .book-body .body-inner { top: 0 !important; }
}
</style>

<script>
document.addEventListener("DOMContentLoaded", function () {
  var nav = document.createElement("div");
  nav.className = "of-booknav";
  nav.innerHTML =
    '<a class="of-booknav__logo" href="https://openforecast.org/">' +
      '<img src="https://openforecast.org/wp-content/uploads/2026/07/cropped-of-logo-full.png" alt="OpenForecast">' +
    '</a>' +
    '<nav class="of-booknav__links">' +
      '<a href="https://openforecast.org/blog/">Blog</a>' +
      '<a href="https://openforecast.org/training/">Training</a>' +
      '<a href="https://openforecast.org/consulting/">Consulting</a>' +
      '<a href="https://openforecast.org/packages/">Packages</a>' +
      '<a href="https://openforecast.org/resources/">Resources</a>' +
      '<a href="https://openforecast.org/contact-us/">Contact us</a>' +
    '</nav>' +
    '<button class="of-booknav__toggle" type="button" aria-label="Toggle OpenForecast menu">&times;</button>';
  document.body.insertBefore(nav, document.body.firstChild);

  var btn = nav.querySelector(".of-booknav__toggle");
  var folded = false;
  try { folded = localStorage.getItem("ofNavFolded") === "1"; } catch (e) {}

  function apply() {
    document.body.classList.toggle("of-nav-folded", folded);
    btn.innerHTML = folded ? "&#9776;" : "&times;";
  }
  apply();

  btn.addEventListener("click", function () {
    folded = !folded;
    try { localStorage.setItem("ofNavFolded", folded ? "1" : "0"); } catch (e) {}
    apply();
  });
});
</script>
