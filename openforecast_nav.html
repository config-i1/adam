<style>
.of-booknav {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 1000;
  display: flex;
  align-items: center;
  gap: 18px;
  flex-wrap: wrap;
  padding: 8px 18px;
  background: #ffffff;
  border-bottom: 2px solid #AE1921;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 14px;
  box-sizing: border-box;
}

.of-booknav__logo img {
  height: 28px;
  width: auto;
  display: block;
}

.of-booknav a {
  color: #222222;
  text-decoration: none;
}

.of-booknav__links {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
}

.of-booknav__links a:hover {
  color: #AE1921;
  text-decoration: underline;
}

/* Push the book's own chrome down so the bar does not overlap it */
body { padding-top: 46px !important; }
.book .book-summary { top: 46px !important; }
.book .book-body { top: 46px !important; }

@media (max-width: 767px) {
  .of-booknav { font-size: 13px; gap: 12px; padding: 6px 12px; }
  .of-booknav__links { gap: 12px; }
}
</style>

<script>
document.addEventListener("DOMContentLoaded", function () {
  var nav = document.createElement("div");
  nav.className = "of-booknav";
  nav.innerHTML =
    '<a class="of-booknav__logo" href="https://openforecast.org/">' +
      '<img src="https://openforecast.org/wp-content/uploads/2026/07/cropped-of-logo-full.png" alt="OpenForecast">' +
    '</a>' +
    '<nav class="of-booknav__links">' +
      '<a href="https://openforecast.org/">Home</a>' +
      '<a href="https://openforecast.org/blog/">Blog</a>' +
      '<a href="https://openforecast.org/training/">Training</a>' +
      '<a href="https://openforecast.org/packages/">Packages</a>' +
      '<a href="https://openforecast.org/resources/">Resources</a>' +
      '<a href="https://openforecast.org/contact-us/">Contact us</a>' +
    '</nav>';
  document.body.insertBefore(nav, document.body.firstChild);
});
</script>
